<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05040a" />
    <meta name="color-scheme" content="dark" />
    <title>404 at the event horizon</title>
    <meta
      name="description"
      content="A typographic web-art 404: a starfield, a black hole, and a continuous fall of the letter w."
    />
    <meta property="og:title" content="404 at the event horizon" />
    <meta
      property="og:description"
      content="www is a path. wwwww is a well. A starry 404 at the edge of the web."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
  </head>
  <body>
    <canvas id="void" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <main class="hud">
      <p class="code">404</p>
      <h1>lost in the wwwww</h1>
      <p class="lede">
        <span>www is a path.</span>
        <span>wwwww is a well.</span>
      </p>
      <p class="note">You followed too many w’s. The rest are still falling.</p>
    </main>

    <p class="brand">wwwww</p>
    <p class="hint">drag the dark</p>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
